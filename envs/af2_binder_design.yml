name: af2_binder_design
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - biopython==1.79
  - ml-collections==0.1.1
  - tensorflow
  - pip
  #- pyrosetta use a symbolic link to dl_binder_design
  - mock
  - pip:
    - --find-links https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
    - jax[cuda12_pip]==0.4.28
    - jaxlib==0.4.28+cuda12.cudnn89
    - dm-haiku==0.0.16
    - dm-tree==0.1.9
    - nvidia-cudnn-cu12==8.9.7.29
